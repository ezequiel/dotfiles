id = "oc-titles"
name = "OC Titles"
version = "0.1.0"
min_herdr_version = "0.7.0"
platforms = ["linux", "macos"]

[[events]]
on = "pane.agent_status_changed"
command = ["bash", "index.sh"]

[[events]]
on = "pane.updated"
command = ["bash", "index.sh"]

[[events]]
on = "pane.focused"
command = ["bash", "index.sh"]

[[events]]
on = "workspace.focused"
command = ["bash", "index.sh"]

[[events]]
on = "pane.agent_detected"
command = ["bash", "index.sh"]

[[events]]
on = "pane.created"
command = ["bash", "index.sh"]
