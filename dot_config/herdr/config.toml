onboarding = false

[keys]
split_vertical = "prefix+|"
new_tab = "ctrl+t"
new_workspace = "cmd+t"
next_tab = "ctrl+tab"
previous_tab = "ctrl+shift+tab"
next_workspace = "cmd+shift+]"
previous_workspace = "cmd+shift+["

previous_agent = "ctrl+shift+["
next_agent = "ctrl+shift+]"
zoom = "prefix+z"

[[keys.command]]
key = "alt+shift+left"
type = "plugin_action"
command = "herdr-splits.nav-left"

[[keys.command]]
key = "alt+shift+down"
type = "plugin_action"
command = "herdr-splits.nav-down"

[[keys.command]]
key = "alt+shift+up"
type = "plugin_action"
command = "herdr-splits.nav-up"

[[keys.command]]
key = "alt+shift+right"
type = "plugin_action"
command = "herdr-splits.nav-right"

[[keys.command]]
key = "ctrl+shift+="
type = "plugin_action"
command = "herdr-splits.resize-right"
description = "expand pane"

[[keys.command]]
key = "ctrl+shift+minus"
type = "plugin_action"
command = "herdr-splits.resize-left"
description = "shrink pane"

[[keys.command]]
key = "prefix+s"
type = "plugin_action"
command = "fullerzz.sesh.open-picker"
description = "open workspace picker"

[[keys.command]]
key = "prefix+L"
type = "plugin_action"
command = "fullerzz.sesh.last"
description = "jump to last workspace"

[[keys.command]]
key = "cmd+z"
type = "shell"
command = "herdr pane zoom --toggle --current"
description = "toggle pane zoom"

[ui]
prompt_new_tab_name = false
pane_borders = false
pane_gaps = false

show_agent_labels_on_pane_borders = false
agent_panel_sort = "priority"
[worktrees]
directory = "~/Projects/worktrees"

[terminal]
shell_mode = "auto"

[experimental]
kitty_graphics = true

[theme]
name = "terminal"

[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
]

[ui.sidebar.agents.rows_by_agent]
opencode = [["state_icon", "$title"]]

[ui.toast]
delivery = "system"
delay_seconds = 1
