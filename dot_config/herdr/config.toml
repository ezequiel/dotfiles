onboarding = false

[keys]
close_workspace = "prefix+d"
split_vertical = "prefix+|"
new_tab = "ctrl+t"
new_workspace = "cmd+t"
next_tab = "ctrl+tab"
previous_tab = "ctrl+shift+tab"
next_workspace = "cmd+shift+]"
previous_workspace = "cmd+shift+["

previous_agent = "ctrl+shift+["
next_agent = "ctrl+shift+]"
zoom = "prefix+z"

[[keys.command]]
key = "alt+shift+left"
type = "plugin_action"
command = "herdr-nvim-nav.left"

[[keys.command]]
key = "alt+shift+down"
type = "plugin_action"
command = "herdr-nvim-nav.down"

[[keys.command]]
key = "alt+shift+up"
type = "plugin_action"
command = "herdr-nvim-nav.up"

[[keys.command]]
key = "alt+shift+right"
type = "plugin_action"
command = "herdr-nvim-nav.right"

[[keys.command]]
key = "ctrl+shift+="
type = "plugin_action"
command = "herdr-splits.resize-right"
description = "expand pane"

[[keys.command]]
key = "ctrl+shift+minus"
type = "plugin_action"
command = "herdr-splits.resize-left"
description = "shrink pane"

[[keys.command]]
key = "prefix+s"
type = "plugin_action"
command = "herdr-newtab-plus.open"
description = "new tab: pick folder + agent"

[[keys.command]]
key = ["prefix+k", "ctrl+alt+k"]
type = "plugin_action"
command = "herdr-bar.open"
description = "command bar"

[[keys.command]]
key = "cmd+z"
type = "shell"
command = "herdr pane zoom --toggle --current"
description = "toggle pane zoom"

[ui]
prompt_new_tab_name = false
pane_borders = false
pane_gaps = false

show_agent_labels_on_pane_borders = false
agent_panel_sort = "priority"
[worktrees]
directory = "~/Projects/worktrees"

[terminal]
shell_mode = "auto"

[session]
# Default 100ms is too tight: on login herdr restores dozens of workspaces and
# every opencode TUI cold-starts against the same SQLite DB at once; a transient
# sync failure silently bounces the resumed pane to a blank home screen.
startup_per_agent_delay_ms = 1000

[experimental]
kitty_graphics = true

[theme]
name = "terminal"

[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
]

[ui.sidebar.agents.rows_by_agent]
opencode = [["state_icon", "$title"]]

[ui.toast]
delivery = "system"
delay_seconds = 1
