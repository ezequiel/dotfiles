id = "herdr-opencode"
name = "Herdr OpenCode"
version = "0.2.0"
min_herdr_version = "0.7.5"
platforms = ["linux", "macos"]

[[panes]]
id = "opencode"
title = "OpenCode"
placement = "split"
command = ["opencode"]

[[events]]
on = "workspace.created"
command = ["bash", "bootstrap.sh"]

[[events]]
on = "workspace.focused"
command = ["bash", "gitstatus.sh"]

[[events]]
on = "pane.focused"
command = ["bash", "gitstatus.sh"]

[[events]]
on = "pane.agent_status_changed"
command = ["bash", "index.sh"]

[[events]]
on = "pane.updated"
command = ["bash", "index.sh"]

[[events]]
on = "pane.focused"
command = ["bash", "index.sh"]

[[events]]
on = "workspace.focused"
command = ["bash", "index.sh"]

[[events]]
on = "pane.agent_detected"
command = ["bash", "index.sh"]

[[events]]
on = "pane.created"
command = ["bash", "index.sh"]
